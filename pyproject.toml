[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hanhai-fengxun"
version = "1.0.0"
description = "寒海风巡 V1.0 真实公共环境驱动的可解释无人艇决策软件原型"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
marine = ["xarray>=2024.1", "h5netcdf>=1.3", "numpy>=1.26", "pandas>=2.1"]

[tool.setuptools.packages.find]
include = ["apps*", "core*", "adapters*"]

